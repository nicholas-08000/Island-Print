<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Island Print – logo principale</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E3B43}a:hover{color:#D9573B}
</style>
</helmet>
<div style="width: 1200px; height: 720px; box-sizing: border-box; background: #F4EFE6; color: #0E3B43; font-family: 'Bricolage Grotesque', Georgia, serif; display: flex; align-items: center; justify-content: center; gap: 64px; padding: 80px">
<img src="./assets/fec48c23acb3ab4eee1a41d481dd3f8c.svg" alt="Impronta digitale a forma di Sardegna" style="height: 440px; width: 260px; object-fit: contain; display: block">
<div style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 0">
<span style="font-size: 132px; line-height: 0.92; font-weight: 800; letter-spacing: -4px">Island</span>
<span style="font-size: 132px; line-height: 0.92; font-weight: 800; letter-spacing: -4px; color: {{accent}}">Print.</span>
</div>
<div style="width: 72px; height: 4px; background: #0E3B43; border-radius: 2px"></div>
<span style="font-size: 30px; line-height: 1.2; font-weight: 500; letter-spacing: -0.3px">Lasciamo il segno, online.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C24A2F","options":["#C24A2F","#0E3B43","#2F6F73"]},"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C24A2F' };
}
}
</script>
</body>
</html>
